name: Build and test

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      release-tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
          - runner: windows-2025
            target: windows-x64
          - runner: windows-11-arm
            target: windows-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      GOG_RELEASE_TAG: ${{ inputs.release-tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:coverage
      - run: dotnet run --project native/windows-tests/Gog.Login.Tests.csproj --configuration Release
      - name: Install WebView2 runtime for native tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer -TimeoutSec 30
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw 'The WebView2 installer must have a valid Microsoft signature.'
          }
          $install = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -PassThru
          if (-not $install.WaitForExit(120000)) {
            $install.Kill()
            throw 'WebView2 installation timed out.'
          }
          if ($install.ExitCode -ne 0) { throw 'WebView2 installation failed.' }
      - run: npm run build -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: distribution-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
